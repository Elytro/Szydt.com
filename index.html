    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            background: #fff;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        body {
            display: flex;
            flex-direction: column;
        }

        /* ── 顶部导航条 ── */
        .top-bar {
            border-bottom: 1px solid #f0f0f0;
            padding: 14px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .top-bar .logo {
            font-size: 16px;
            font-weight: 500;
            color: #1a1a1a;
            letter-spacing: 2px;
            text-decoration: none;
        }
        .top-bar .logo i {
            color: #ccc;
            margin-right: 8px;
            font-size: 18px;
        }
        .top-bar .nav-links a {
            font-size: 13px;
            color: #999;
            text-decoration: none;
            margin-left: 24px;
            transition: color .2s;
        }
        .top-bar .nav-links a:hover { color: #1a1a1a; }

        /* ── 主体区 ── */
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
        }

        /* ── 欢迎语 ── */
        .welcome {
            text-align: center;
            margin-bottom: 48px;
        }
        .welcome .icon-circle {
            display: inline-block;
            width: 56px;
            height: 56px;
            line-height: 56px;
            border-radius: 50%;
            border: 1px solid #e8e8e8;
            color: #888;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .welcome h3 {
            margin: 0 0 6px;
            font-size: 20px;
            font-weight: 400;
            color: #1a1a1a;
            letter-spacing: 3px;
        }
        .welcome p {
            margin: 0;
            font-size: 13px;
            color: #bbb;
            letter-spacing: 1px;
        }

        /* ── 表单 ── */
        .login-card .field {
            position: relative;
            margin-bottom: 28px;
        }
        .login-card .field .fa {
            position: absolute;
            left: 0;
            top: 12px;
            color: #ccc;
            font-size: 15px;
            z-index: 2;
            transition: color .25s;
        }
        .login-card .field input {
            width: 100%;
            padding: 10px 0 10px 28px;
            border: none;
            border-bottom: 1px solid #e8e8e8;
            border-radius: 0;
            outline: none;
            font-size: 15px;
            color: #333;
            background: transparent;
            transition: border-color .25s;
        }
        .login-card .field input:focus {
            border-bottom-color: #1a1a1a;
        }
        .login-card .field input:focus + .fa,
        .login-card .field input:focus ~ .fa {
            color: #1a1a1a;
        }
        .login-card .field input::placeholder {
            color: #ccc;
        }

        /* ── 记住我 / 选项行 ── */
        .options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            font-size: 13px;
            color: #aaa;
        }
        .options label {
            font-weight: 400;
            cursor: pointer;
            margin: 0;
        }
        .options label input {
            margin-right: 6px;
            vertical-align: middle;
        }
        .options a {
            color: #aaa;
            text-decoration: none;
            transition: color .2s;
        }
        .options a:hover { color: #1a1a1a; }

        /* ── 按钮 ── */
        .btn-submit {
            width: 100%;
            height: 46px;
            border: 1px solid #1a1a1a;
            background: #1a1a1a;
            color: #fff;
            font-size: 14px;
            letter-spacing: 4px;
            border-radius: 23px;
            cursor: pointer;
            transition: all .25s;
            outline: none;
        }
        .btn-submit:hover {
            background: #fff;
            color: #1a1a1a;
        }

        /* ── 底部链区 ── */
        .extra-links {
            text-align: center;
            margin-top: 32px;
            font-size: 13px;
            color: #ccc;
        }
        .extra-links span { margin: 0 4px; }
        .extra-links a {
            color: #bbb;
            text-decoration: none;
            transition: color .2s;
        }
        .extra-links a:hover { color: #1a1a1a; }

        /* ── 备案 ── */
        .footer {
            text-align: center;
            padding: 18px 15px;
            font-size: 12px;
            color: #d0d0d0;
            border-top: 1px solid #f7f7f7;
        }
        .footer a {
            color: #d0d0d0;
            text-decoration: none;
            transition: color .2s;
        }
        .footer a:hover { color: #999; }

        /* ── 移动端微调 ── */
        @media (max-width: 480px) {
            .top-bar { padding: 12px 18px; }
            .top-bar .nav-links a { margin-left: 14px; font-size: 12px; }
            .main { padding: 30px 18px; }
            .welcome { margin-bottom: 36px; }
            .welcome h3 { font-size: 18px; letter-spacing: 2px; }
            .btn-submit { border-radius: 4px; }
        }
    </style>
</head>
<body>

    <!-- 顶栏 -->
    <div class="top-bar">
        <a class="logo" href="#"><i class="fa fa-newspaper-o"></i>时政通</a>
        <div class="nav-links">
            <a href="#">首页</a>
            <a href="#">题库</a>
            <a href="#">关于</a>
        </div>
    </div>

    <!-- 主体 -->
    <div class="main">
        <div class="login-card">
            <div class="welcome">
                <div class="icon-circle"><i class="fa fa-globe"></i></div>
                <h3>时政一点通</h3>
                <p>POLITICAL NEWS · SIGN IN</p>
            </div>

            <form>
                <div class="field">
                    <i class="fa fa-envelope-o"></i>
                    <input type="text" placeholder="用户名" autocomplete="off">
                </div>
                <div class="field">
                    <i class="fa fa-key"></i>
                    <input type="password" placeholder="密码" autocomplete="off">
                </div>

                <div class="options">
                    <label><input type="checkbox"> 保持登录</label>
                    <a href="#">忘记密码？</a>
                </div>

                <button type="submit" class="btn-submit">登  录</button>
            </form>

                还没有账号？<a href="#">立即注册 <i class="fa fa-arrow-right"></i></a>
            </div>-->
        </div>
    </div>

    <!-- 备案号 -->
